# Production deterministic-gold SFT. The coordinator replaces environment.id.
model = "Qwen/Qwen3.5-4B"
algorithm = "sft"
thinking = false
seed = 0

[environment]
id = "local/cortesol-belief-update"
pip = ["networkx>=3.3", "numpy>=2.0", "pydantic>=2.7"]

[environment.params]
split = "sft_train"

[train]
lora_rank = 32
lora_alpha = 64
max_context_tokens = 2048
max_completion_tokens = 256
max_examples = 2800
max_steps = 500
save_at_steps = [100, 250, 500]
