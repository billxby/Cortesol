# Primary GRPO. The coordinator pins init_from_adapter to the promoted SFT checkpoint.
model = "Qwen/Qwen3.5-4B"
algorithm = "grpo"
thinking = false
seed = 0

[environment]
id = "local/cortesol-belief-update"
pip = ["networkx>=3.3", "numpy>=2.0", "pydantic>=2.7"]

[environment.params]
split = "rl_train"

[train]
init_from_adapter = "cortesol-sft"
max_context_tokens = 8192
max_completion_tokens = 256
group_size = 8
max_examples = 1024
max_steps = 400
save_at_steps = [50, 100, 200, 400]
structured_outputs = "json_object"
