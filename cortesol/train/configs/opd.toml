# Short disposable OPD branch. GLM-5.2 credentials are managed by Flash.
model = "Qwen/Qwen3.5-4B"
algorithm = "opd"
thinking = false
seed = 0

[environment]
id = "local/cortesol-belief-update"
pip = ["networkx>=3.3", "numpy>=2.0", "pydantic>=2.7"]

[environment.params]
split = "rl_train"

[train]
init_from_adapter = "cortesol-sft"
teacher_model = "glm-5.2"
max_context_tokens = 12288
max_completion_tokens = 256
group_size = 1
max_examples = 1024
max_steps = 20
save_at_steps = [5, 10, 20]
structured_outputs = "json_object"
