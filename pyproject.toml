[project]
name = "cortesol"
version = "0.1.0"
description = "Cortesol is a neuro-symbolic agent with memory and an epistemic immune system. A belief graph whose update policy is a Freesolo-trained small model behind a deterministic validator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "numpy>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Heavier / branch-specific extras. Install only what your branch needs:
#   uv sync --extra ml     (Branch 2/3: embeddings, NLI)
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
train = [
    "freesolo>=0.2.54,<0.3",
    "freesolo-flash==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortesol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: invariants that gate every merge to main (must always pass)",
    "unit: single-component tests",
    "integration: cross-branch tests through the frozen interfaces",
    "slow: hits the network / a model / Flash (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
